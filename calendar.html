<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050508">
<link rel="apple-touch-icon" href="avatar.png">
<title>DEXTER — Calendar</title>
<style>
  /* Wall calendar for DEXTER-OS, v2. Served at /calendar (Pages clean URLs). Data: GET /api/calendar.
     Plain ES2018 and no keyboard: it runs in the DF-18T's Android 14 WebView (1920x1280 landscape, read
     from across a room) and on the phone in portrait. Colors and fonts follow index.html. The Google Fonts
     stylesheet is linked AFTER the script on purpose: a stylesheet in <head> holds the script back, and a
     stalled fonts request once left a page dead on a weak connection. */
  :root {
    --bg: #050508;
    --panel: #0d0d14;
    --border: #151525;
    --line: rgba(120,140,170,0.13);
    --accent: #00d4ff;
    --accent2: #39ff14;
    --accent3: #ff4400;
    --now: #ff2d55;
    --gold: #ffaa00;
    --text: #c8d6e5;
    --dim: #3a4558;
    --mid: #6b7a90;
    --bright: #edf2f7;
    --work: rgba(0,212,255,0.045);
    --mono: 'Share Tech Mono', monospace;
    --display: 'Orbitron', sans-serif;
    --body: 'Rajdhani', sans-serif;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --u: 1vw;                         /* landscape sizes scale with the width: 19.2px on the wall */
    --gut: calc(var(--u) * 4.6);      /* hour-label gutter; the ‹ button sits in the same width */
    --nav: calc(var(--u) * 3.0);      /* › button width; WEEK keeps a spacer this wide so columns line up */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; height: -webkit-fill-available;
    overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: var(--body);
    -webkit-user-select: none; user-select: none;
  }
  body::before {
    content: ''; position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none; z-index: 0;
  }
  .tap { cursor: pointer; }

  /* ── LAYOUT: DEXTER column left (30%), calendar right (70%) ── */
  .app {
    position: relative; z-index: 1;
    display: flex;
    height: 100%; height: -webkit-fill-available;
    padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
  }
  .side {
    flex: 0 0 30%; min-width: 0;
    display: flex; flex-direction: column;
    padding: calc(var(--u) * 2.0) calc(var(--u) * 2.0) calc(var(--u) * 1.6);
    border-right: 1px solid var(--border);
    background: rgba(5,5,8,0.72);
  }
  .main {
    flex: 1; min-width: 0; min-height: 0; position: relative;
    display: flex; flex-direction: column;
    padding: calc(var(--u) * 1.4) calc(var(--u) * 1.6) calc(var(--u) * 1.2);
  }

  /* ── FACE (same loops and fallback chain as index.html) ── */
  .face-zone {
    position: relative; align-self: center;
    display: flex; flex-direction: column; align-items: center;
    cursor: pointer;
  }
  .face-amb {
    position: absolute; top: -12%; left: -12%; width: 124%; padding-top: 124%;
    border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(0,212,255,0.10) 0%, transparent 68%);
  }
  .face { position: relative; width: calc(var(--u) * 13.5); height: calc(var(--u) * 13.5); }
  .face-border {
    position: absolute; top: -3px; right: -3px; bottom: -3px; left: -3px;
    clip-path: polygon(14% 0%, 86% 0%, 100% 14%, 100% 86%, 86% 100%, 14% 100%, 0% 86%, 0% 14%);
    background: linear-gradient(135deg, var(--accent), var(--accent2), var(--gold), var(--accent3));
    opacity: 0.6;
    animation: border-hue 4s linear infinite;
  }
  @keyframes border-hue { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
  .face-img-wrap {
    position: relative; width: 100%; height: 100%; overflow: hidden; background: #000;
    clip-path: polygon(14% 0%, 86% 0%, 100% 14%, 100% 86%, 86% 100%, 14% 100%, 0% 86%, 0% 14%);
  }
  .face-img-wrap img, .face-img-wrap video {
    display: block; width: 100%; height: 100%; object-fit: cover;
    filter: brightness(0.92) saturate(1.2);
  }
  /* The <video> shows only once body.face-mode-video is set by faceInit(); until then (and in the webp /
     static fallbacks) the <img> shows, so there is never an empty box. */
  .face-video { display: none !important; }
  body.face-mode-video .face-video { display: block !important; }
  body.face-mode-video .face-img { display: none !important; }
  .face-scan { position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; overflow: hidden; }
  .face-scan::after {
    content: ''; position: absolute; left: 0; right: 0; height: 2px; top: -2px;
    background: linear-gradient(90deg, transparent, rgba(0,212,255,0.5), transparent);
    animation: ascan 3s linear infinite;
  }
  @keyframes ascan { from { top: -2px; } to { top: 100%; } }
  .face-cap {
    margin-top: calc(var(--u) * 0.9);
    font-family: var(--mono); font-size: calc(var(--u) * 0.95); letter-spacing: 0.35em;
    color: var(--accent); text-shadow: 0 0 10px rgba(0,212,255,0.5);
    text-transform: uppercase; white-space: nowrap;
  }
  .face-zone:active .face { transform: scale(0.97); }

  /* ── CLOCK ── */
  .time { margin-top: calc(var(--u) * 1.6); min-width: 0; }
  .clock {
    font-family: var(--display); font-weight: 700;
    font-size: calc(var(--u) * 7.4); line-height: 1;
    letter-spacing: -0.02em; color: var(--bright);
    text-shadow: 0 0 30px rgba(0,212,255,0.25);
    white-space: nowrap;
  }
  .clock .sub {
    font-family: var(--mono); font-size: calc(var(--u) * 2.0); font-weight: 400;
    letter-spacing: 0.08em; color: var(--accent); margin-left: 0.3em; vertical-align: top;
  }
  .weekday {
    margin-top: calc(var(--u) * 1.0);
    font-size: calc(var(--u) * 2.7); font-weight: 700; line-height: 1.1; color: var(--bright);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .date { margin-top: calc(var(--u) * 0.2); font-size: calc(var(--u) * 2.0); color: var(--text); }

  /* ── NEXT UP ── */
  .next {
    margin-top: calc(var(--u) * 1.8);
    padding: calc(var(--u) * 1.1) calc(var(--u) * 1.2);
    background: rgba(13,13,20,0.92);
    border: 1px solid var(--border); border-left: calc(var(--u) * 0.3) solid var(--accent);
    min-width: 0;
  }
  .next-label { font-family: var(--display); font-weight: 900; font-size: calc(var(--u) * 0.95); letter-spacing: 0.3em; color: var(--accent); }
  .next-none { margin-top: calc(var(--u) * 0.5); font-size: calc(var(--u) * 1.7); font-weight: 600; color: var(--mid); }
  .next-title { margin-top: calc(var(--u) * 0.5); font-size: calc(var(--u) * 2.0); font-weight: 700; line-height: 1.15; color: var(--bright); overflow-wrap: anywhere; }
  .next-time { margin-top: calc(var(--u) * 0.35); font-family: var(--mono); font-size: calc(var(--u) * 1.35); color: var(--text); }
  .next-time .tag { color: var(--gold); margin-right: 0.6em; letter-spacing: 0.15em; }
  .next-in { margin-top: calc(var(--u) * 0.3); font-family: var(--mono); font-size: calc(var(--u) * 1.35); color: var(--accent2); letter-spacing: 0.06em; }

  /* ── STATUS + GEAR ── */
  .side-foot { margin-top: auto; display: flex; align-items: center; gap: calc(var(--u) * 1.0); padding-top: calc(var(--u) * 1); }
  .gear {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
    width: calc(var(--u) * 3.3); height: calc(var(--u) * 3.3);
    border: 1px solid rgba(0,212,255,0.3); border-radius: 2px; background: rgba(0,212,255,0.05);
    color: var(--accent); cursor: pointer;
  }
  .gear svg { width: 58%; height: 58%; fill: currentColor; }
  .gear:active { background: rgba(0,212,255,0.2); }
  .status {
    font-family: var(--mono); font-size: calc(var(--u) * 0.95);
    letter-spacing: 0.12em; color: var(--mid); min-width: 0; overflow-wrap: anywhere;
  }
  .status.warn { color: var(--gold); }
  .status.bad { color: var(--accent3); }

  /* ── BAR: tabs, heading, navigation ── */
  .bar { display: flex; align-items: center; gap: calc(var(--u) * 1.0); flex-shrink: 0; min-width: 0; }
  .tabs { display: flex; flex-shrink: 0; border: 1px solid rgba(0,212,255,0.35); border-radius: 2px; }
  .tab {
    font-family: var(--display); font-weight: 700;
    font-size: calc(var(--u) * 1.05); letter-spacing: 0.25em;
    padding: calc(var(--u) * 0.95) calc(var(--u) * 1.7);
    color: var(--accent); cursor: pointer;
    border-right: 1px solid rgba(0,212,255,0.35);
  }
  .tab:last-child { border-right: 0; }
  .tab.on { background: var(--accent); color: #050508; box-shadow: 0 0 24px rgba(0,212,255,0.35); }
  .head { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 0.6em; overflow: hidden; white-space: nowrap; }
  .head-label { font-family: var(--display); font-weight: 900; font-size: calc(var(--u) * 1.5); letter-spacing: 0.22em; color: var(--accent); text-shadow: 0 0 14px rgba(0,212,255,0.4); }
  .head-date { font-size: calc(var(--u) * 1.5); font-weight: 600; color: var(--text); letter-spacing: 0.04em; overflow: hidden; text-overflow: ellipsis; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    font-family: var(--display); font-weight: 700;
    font-size: calc(var(--u) * 1.0); letter-spacing: 0.2em;
    color: var(--accent); background: rgba(0,212,255,0.06);
    border: 1px solid rgba(0,212,255,0.35); border-radius: 2px;
    padding: calc(var(--u) * 0.95) calc(var(--u) * 1.4);
    cursor: pointer; text-align: center;
  }
  .btn:active { background: rgba(0,212,255,0.2); }
  .btn.arrow { font-family: var(--body); font-size: calc(var(--u) * 1.8); line-height: 1; letter-spacing: 0; padding: calc(var(--u) * 0.45) calc(var(--u) * 1.1); }
  .btn.gold { color: var(--gold); border-color: rgba(255,170,0,0.45); background: rgba(255,170,0,0.06); }
  .hide { display: none !important; }

  /* ── DAY BUTTONS (one week) ── */
  .days {
    flex-shrink: 0;
    display: grid; grid-template-columns: var(--gut) repeat(7, minmax(0, 1fr)) var(--nav);
    margin-top: calc(var(--u) * 1.0);
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  }
  .dnav {
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--u) * 2.2); color: var(--accent); cursor: pointer;
  }
  .dnav:active { background: rgba(0,212,255,0.15); }
  .dbtn {
    display: flex; align-items: baseline; justify-content: center; gap: 0.45em;
    padding: calc(var(--u) * 0.7) 0 calc(var(--u) * 0.6);
    cursor: pointer; min-width: 0; position: relative;
    border-left: 1px solid var(--border);
  }
  .dbtn:nth-child(8) { border-right: 1px solid var(--border); }
  .dbtn .wd { font-family: var(--mono); font-size: calc(var(--u) * 0.95); letter-spacing: 0.2em; color: var(--mid); }
  .dbtn .dn { font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 1.55); color: var(--text); }
  .dbtn.work { background: var(--work); }
  .dbtn.today .wd, .dbtn.today .dn { color: var(--accent); }
  .dbtn.today .dn { text-shadow: 0 0 12px rgba(0,212,255,0.6); }
  .dbtn.sel { background: rgba(255,170,0,0.10); box-shadow: inset 0 calc(var(--u) * -0.25) 0 var(--gold); }
  .dbtn.sel .dn { color: var(--gold); }
  .dbtn.sel.today .dn { color: var(--accent); }
  .dbtn .cnt { position: absolute; top: calc(var(--u) * 0.35); right: calc(var(--u) * 0.45); width: calc(var(--u) * 0.45); height: calc(var(--u) * 0.45); border-radius: 50%; background: var(--accent); opacity: 0.8; }

  /* ── VIEW AREA ── */
  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; margin-top: calc(var(--u) * 0.8); }

  /* all-day / outside-hours chips */
  .chips { flex-shrink: 0; display: flex; flex-wrap: wrap; gap: calc(var(--u) * 0.5); margin: 0 0 calc(var(--u) * 0.7) var(--gut); }
  .chip {
    display: inline-flex; align-items: baseline; gap: 0.5em; max-width: 100%;
    padding: calc(var(--u) * 0.35) calc(var(--u) * 0.8);
    font-size: calc(var(--u) * 1.25); font-weight: 700; color: var(--bright);
    background: rgba(0,212,255,0.16); border-left: calc(var(--u) * 0.25) solid var(--accent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chip .k { font-family: var(--mono); font-weight: 400; font-size: 0.8em; letter-spacing: 0.12em; color: var(--accent2); }
  .chip.declined { opacity: 0.45; text-decoration: line-through; }
  .wk-allday { flex-shrink: 0; display: flex; margin-bottom: calc(var(--u) * 0.6); }
  .wk-allday .lbl { flex: 0 0 var(--gut); font-family: var(--mono); font-size: calc(var(--u) * 0.7); letter-spacing: 0.12em; color: var(--mid); padding-top: 0.5em; }
  .wk-allday .cells { flex: 1; min-width: 0; display: flex; }
  .wk-allday .cell { flex: 1; min-width: 0; padding: 0 2px; display: flex; flex-direction: column; gap: 2px; }
  .wk-allday .sp { flex: 0 0 var(--nav); }
  .wk-allday .chip { font-size: calc(var(--u) * 0.9); padding: calc(var(--u) * 0.2) calc(var(--u) * 0.4); display: block; }
  .wk-allday .more { font-family: var(--mono); font-size: calc(var(--u) * 0.75); color: var(--mid); }

  /* time grid */
  .tl { flex: 1; min-height: 0; display: flex; position: relative; padding: calc(var(--u) * 0.6) 0; }
  .tl-hours { flex: 0 0 var(--gut); position: relative; }
  .tl-hl {
    position: absolute; right: calc(var(--u) * 0.7); transform: translateY(-50%);
    font-family: var(--mono); font-size: calc(var(--u) * 1.0); color: var(--mid); white-space: nowrap;
  }
  .tl-body { flex: 1; min-width: 0; position: relative; display: flex; }
  .tl-spacer { flex: 0 0 var(--nav); }
  .tl-line { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--line); z-index: 1; pointer-events: none; }
  .tl-line.half { border-top-style: dashed; border-top-color: rgba(120,140,170,0.06); }
  .tl-col { flex: 1; min-width: 0; position: relative; border-left: 1px solid var(--border); }
  .tl-col:last-child { border-right: 1px solid var(--border); }
  .tl-col.work { background: var(--work); }
  .tl-col.out { background: repeating-linear-gradient(135deg, rgba(58,69,88,0.10) 0 10px, transparent 10px 20px); }
  .week .tl-col { cursor: pointer; }

  .ev {
    position: absolute; z-index: 2; overflow: hidden;
    padding: calc(var(--u) * 0.3) calc(var(--u) * 0.6);
    border-left: calc(var(--u) * 0.28) solid var(--accent);
    background: rgba(0,212,255,0.20);
    border-radius: 2px;
    box-shadow: 0 0 0 1px rgba(5,5,8,0.9);
  }
  .ev-t { font-family: var(--mono); font-size: calc(var(--u) * 1.0); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev-n { font-size: calc(var(--u) * 1.45); font-weight: 700; line-height: 1.15; color: var(--bright); overflow-wrap: anywhere; }
  .ev-l { font-size: calc(var(--u) * 1.05); color: var(--text); opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev.short { display: flex; align-items: baseline; gap: 0.6em; white-space: nowrap; padding-top: calc(var(--u) * 0.1); padding-bottom: 0; }
  .ev.short .ev-n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev.declined { opacity: 0.42; }
  .ev.declined .ev-n { text-decoration: line-through; }
  .ev.tentative { border-left-style: dashed; }
  .ev.tentative .ev-n::after { content: ' ?'; color: var(--gold); }
  .week .ev { padding: calc(var(--u) * 0.15) calc(var(--u) * 0.3); }
  .week .ev-t { font-size: calc(var(--u) * 0.75); }
  .week .ev-n { font-size: calc(var(--u) * 0.95); overflow-wrap: normal; word-break: keep-all; }
  .week .ev.short { display: block; }
  .week .ev.short .ev-t { display: none; }

  .now-line { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--now); z-index: 3; pointer-events: none; box-shadow: 0 0 10px var(--now); }
  .now-line::before {
    content: ''; position: absolute; left: calc(var(--u) * -0.5); top: calc(var(--u) * -0.5 - 1px);
    width: calc(var(--u) * 1.0); height: calc(var(--u) * 1.0); border-radius: 50%; background: var(--now);
  }
  .msg {
    position: absolute; top: 40%; left: var(--gut); right: 0; z-index: 4; text-align: center; pointer-events: none;
    font-size: calc(var(--u) * 2.4); font-weight: 600; color: var(--mid); letter-spacing: 0.05em;
  }
  .msg span { display: inline-block; padding: 0.25em 0.9em; background: rgba(5,5,8,0.92); border: 1px solid var(--border); }
  .msg.wide { left: 0; }

  /* loading: a thin line along the top of the calendar while the shown range is being fetched */
  .loadbar { position: absolute; top: 0; left: 0; right: 0; height: 3px; z-index: 8; pointer-events: none; opacity: 0; transition: opacity .2s; overflow: hidden; }
  .loadbar.on { opacity: 1; }
  .loadbar::after {
    content: ''; position: absolute; top: 0; bottom: 0; left: -30%; width: 30%;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: loadbar 1.1s linear infinite;
  }
  @keyframes loadbar { from { left: -30%; } to { left: 100%; } }

  /* ── MONTH ── */
  .mgrid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 2px; }
  .mwd { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; flex-shrink: 0; }
  .mwd div { font-family: var(--mono); font-size: calc(var(--u) * 0.95); letter-spacing: 0.2em; color: var(--mid); text-align: center; padding: 0.3em 0 0.5em; }
  .mwd div.work { color: var(--text); }
  .mday {
    position: relative; min-height: 0; overflow: hidden; cursor: pointer;
    background: rgba(13,13,20,0.92); border: 1px solid var(--border);
    padding: calc(var(--u) * 0.5) calc(var(--u) * 0.6);
    display: flex; flex-direction: column;
  }
  .mday.work { background: #0c1420; }
  .mday .n { font-family: var(--display); font-weight: 700; font-size: calc(var(--u) * 1.5); color: var(--text); }
  .mday.other .n { color: var(--dim); }
  .mday.today { border-color: rgba(0,212,255,0.7); box-shadow: inset 0 0 0 1px rgba(0,212,255,0.5); }
  .mday.today .n { color: var(--accent); text-shadow: 0 0 12px rgba(0,212,255,0.6); }
  .mday.sel { box-shadow: inset 0 0 0 2px var(--gold); }
  .mday.out .n { opacity: 0.55; }
  .mday .dots { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 0.3); margin-top: auto; align-items: center; }
  .mday .dot { width: calc(var(--u) * 0.65); height: calc(var(--u) * 0.65); border-radius: 50%; background: var(--accent); }
  .mday .count { font-family: var(--mono); font-size: calc(var(--u) * 0.95); color: var(--text); margin-left: 0.2em; }

  /* ── SETTINGS SHEET ── */
  .sheet-scrim { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 40; background: rgba(0,0,0,0.65); display: none; }
  .sheet-scrim.open { display: block; }
  .sheet {
    position: fixed; z-index: 41; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(60vw, 1100px); max-height: 92%;
    display: none; flex-direction: column;
    background: var(--bg); border: 1px solid rgba(0,212,255,0.35);
    box-shadow: 0 0 60px rgba(0,0,0,0.8), 0 0 30px rgba(0,212,255,0.12);
  }
  .sheet.open { display: flex; }
  .sheet-head {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: calc(var(--u) * 1.1) calc(var(--u) * 1.6); border-bottom: 1px solid var(--border);
  }
  .sheet-title { font-family: var(--display); font-weight: 900; font-size: calc(var(--u) * 1.3); letter-spacing: 0.3em; color: var(--accent); }
  .sheet-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: calc(var(--u) * 0.6) calc(var(--u) * 1.6) calc(var(--u) * 1.4); }

  .scrim { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 29; background: rgba(0,0,0,0.5); display: none; }

  /* ── PORTRAIT / PHONE: face + clock row, tabs, then the view; gear in the header ── */
  @media (max-width: 760px), (orientation: portrait) {

    .tab { font-size: 12px; letter-spacing: 0.18em; padding: 11px 14px; }

    .btn.arrow { font-size: 22px; padding: 4px 12px; }

    .dnav { font-size: 26px; }

    .tl-hl { font-size: 10px; right: 6px; }

<body>

<div class="app" id="app">
  <aside class="side">
    <div class="face-zone" id="face" role="button" aria-label="Talk to DEXTER">
      <div class="face-amb"></div>
      <div class="face">
        <div class="face-border"></div>
        <div class="face-img-wrap">
          <video class="face-video" id="faceVideo" muted loop playsinline preload="auto" poster="avatar.png" aria-label="DEXTER"></video>
          <img class="face-img" id="faceImg" src="avatar.png" alt="DEXTER">
          <div class="face-scan"></div>
        </div>
      </div>
      <div class="face-cap">Tap to talk</div>
    </div>
    <div class="time">
      <div class="clock" id="clock">--:--</div>
      <div class="weekday" id="weekday">&nbsp;</div>
      <div class="date" id="date">&nbsp;</div>
    </div>
    <div class="next" id="next"><div class="next-label">NEXT UP</div></div>
    <div class="side-foot">
      <div class="gear" id="gearBtn" role="button" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M20.05 9.99L22.89 10.47L22.89 13.53L20.05 14.01L19.11 16.27L20.78 18.62L18.62 20.78L16.27 19.11L14.01 20.05L13.53 22.89L10.47 22.89L9.99 20.05L7.73 19.11L5.38 20.78L3.22 18.62L4.89 16.27L3.95 14.01L1.11 13.53L1.11 10.47L3.95 9.99L4.89 7.73L3.22 5.38L5.38 3.22L7.73 4.89L9.99 3.95L10.47 1.11L13.53 1.11L14.01 3.95L16.27 4.89L18.62 3.22L20.78 5.38L19.11 7.73Z M8.4 12a3.6 3.6 0 1 0 7.2 0a3.6 3.6 0 1 0 -7.2 0Z"/></svg></div>
      <div class="status" id="status">loading…</div>
    </div>
  </aside>

  <section class="main">
    <div class="loadbar" id="loadbar"></div>
    <div class="bar">
      <div class="tabs">
        <div class="tab on" id="tabDay" data-view="day">DAY</div>
        <div class="tab" id="tabWeek" data-view="week">WEEK</div>
        <div class="tab" id="tabMonth" data-view="month">MONTH</div>
      </div>
      <div class="btn arrow hide" id="monthPrev" aria-label="Previous month">&lsaquo;</div>
      <div class="head" id="head"><span class="head-label" id="headLabel"></span><span class="head-date" id="headDate"></span></div>
      <div class="btn arrow hide" id="monthNext" aria-label="Next month">&rsaquo;</div>
      <div class="btn gold hide" id="todayBtn">TODAY</div>
    </div>
    <div class="days" id="days"></div>
    <div class="view" id="view"></div>
  </section>
</div>

<div class="sheet-scrim" id="sheetScrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Calendar settings">
  <div class="sheet-head">
    <div class="sheet-title">SETTINGS</div>
    <div class="btn" id="sheetDone">DONE</div>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="logo">DEXTER</div>
    <div class="btn drawer-close" id="drawerClose">CLOSE &times;</div>
  </div>
  <iframe id="dexterFrame" title="DEXTER" allow="microphone"></iframe>
</div>

<script>
(function () {
  'use strict';
  // The calendar feed. DEXTER-OS serves /api/calendar; the Mac voice server's /wall sets "/wall/calendar".
  // Contract: GET CAL_ENDPOINT?from=YYYY-MM-DD&to=YYYY-MM-DD (New York dates, `to` exclusive), header
  // X-Dexter-Passphrase -> { generatedAt, tz, from, to, calendars:[{id,name,color}],
  // events:[{id,cal,title,start,end,allDay,location,status,declined}] } for the events overlapping the range.
  var CAL_ENDPOINT = '/api/calendar';
  var CHAT_SRC = '/';                 // what the chat drawer iframes
  var REFRESH_MS = 5 * 60 * 1000;
  var DEFAULT_TZ = 'America/New_York';
  var SETTINGS_KEY = 'dexterCalSettings';
  var MIN_BLOCK = 25;   // minutes: the shortest a block is drawn, so a 5-minute event is still readable
  var WD = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  var WD_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  var store = {};         // 'from|to' -> { from, to, events, gen, at }: every range loaded; per day the newest wins
  var calendars = [];     // calendar list from the latest good response
  var inflight = {};      // 'from|to' -> true while that range is being fetched
  var lastGood = null;    // Date of the last good fetch (any range)
  var tz = DEFAULT_TZ;
  var todayKey = '';
  var selKey = '';        // the day DAY shows; the day-button row shows its week
  var view = 'day';       // 'day' | 'week' | 'month'
  var monthCursor = null; // {y, m} shown in MONTH
  var byDay = {};         // key -> visible entries on that day (rebuilt on every render)
  var lastMinute = '';

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  // ── settings: display only, this device only, never the kiosk's own settings ──
  function defaults() { return { clock24: true, seconds: false, weekStart: 0, workShade: true, dayStart: 5, dayEnd: 23, hiddenCals: [], idleMin: 5 }; }
  function intIn(v, lo, hi) { return (typeof v === 'number' && v % 1 === 0 && v >= lo && v <= hi) ? v : null; }
  function loadSettings() {
    var s = defaults();
    var raw = null;
    try { raw = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null'); } catch (e) { raw = null; }
    if (raw && typeof raw === 'object') {
      if (typeof raw.clock24 === 'boolean') s.clock24 = raw.clock24;
      if (typeof raw.seconds === 'boolean') s.seconds = raw.seconds;
      if (raw.weekStart === 0 || raw.weekStart === 1) s.weekStart = raw.weekStart;
      if (typeof raw.workShade === 'boolean') s.workShade = raw.workShade;
      var a = intIn(raw.dayStart, 0, 23), b = intIn(raw.dayEnd, 1, 24);
      if (a !== null && b !== null && a < b) { s.dayStart = a; s.dayEnd = b; }
      if (Array.isArray(raw.hiddenCals)) s.hiddenCals = raw.hiddenCals.filter(function (x) { return typeof x === 'string'; });
      if (raw.idleMin === 0 || raw.idleMin === 5 || raw.idleMin === 15) s.idleMin = raw.idleMin;
    }
    return s;
  }
  var S = loadSettings();
  function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(S)); } catch (e) {} }

  // ── time in the calendar's zone (never the device's) ──
  var partFmt = {};
  function partsIn(date, zone) {
    var f = partFmt[zone];
    if (!f) {
      f = partFmt[zone] = new Intl.DateTimeFormat('en-US', { timeZone: zone, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    var out = {};
    var parts = f.formatToParts(date);
    for (var i = 0; i < parts.length; i++) out[parts[i].type] = parts[i].value;
    return { y: +out.year, m: +out.month, d: +out.day, h: (+out.hour) % 24, mi: +out.minute, s: +out.second };
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function keyOf(p) { return p.y + '-' + pad2(p.m) + '-' + pad2(p.d); }
  function dayKey(date) { return keyOf(partsIn(date, tz)); }
  function parseKey(key) { return { y: +key.slice(0, 4), m: +key.slice(5, 7), d: +key.slice(8, 10) }; }
  // Days are stepped in UTC from the y/m/d triple, so DST never shifts a date.
  function addDays(key, n) {
    var p = parseKey(key);
    var t = new Date(Date.UTC(p.y, p.m - 1, p.d + n));
    return t.getUTCFullYear() + '-' + pad2(t.getUTCMonth() + 1) + '-' + pad2(t.getUTCDate());
  }
  function weekdayOf(key) { var p = parseKey(key); return new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay(); }
  function isWork(key) { var w = weekdayOf(key); return w >= 1 && w <= 5; }   // Mon–Fri, whatever the week start
  function weekStartOf(key) { return addDays(key, -((weekdayOf(key) - S.weekStart + 7) % 7)); }
  function longDate(key) { var p = parseKey(key); return WD_LONG[weekdayOf(key)] + ', ' + MONTHS[p.m - 1] + ' ' + p.d; }
  function shortDate(key) { var p = parseKey(key); return MONTHS[p.m - 1].slice(0, 3) + ' ' + p.d; }

  // ── formatting: 24-hour by default, 12-hour from the settings sheet ──
  function fmtHM(h, mi) {
    if (S.clock24) return pad2(h) + ':' + pad2(mi);
    var hh = h % 12; if (hh === 0) hh = 12;
    return hh + ':' + pad2(mi) + ' ' + ((h % 24) < 12 ? 'AM' : 'PM');
  }
  function fmtHour(h) {
    if (S.clock24) return pad2(h) + ':00';
    var hh = h % 12; if (hh === 0) hh = 12;
    return hh + ' ' + ((h % 24) < 12 ? 'AM' : 'PM');
  }
  function fmtRange(ev) {
    var a = ev._s, b = ev._e;
    if (S.clock24) return ev.end === ev.start ? fmtHM(a.h, a.mi) : fmtHM(a.h, a.mi) + '–' + fmtHM(b.h, b.mi);
    var am = a.h < 12, bm = b.h < 12;
    var ah = a.h % 12 || 12, bh = b.h % 12 || 12;
    if (ev.end === ev.start) return ah + ':' + pad2(a.mi) + ' ' + (am ? 'AM' : 'PM');
    if (am === bm) return ah + ':' + pad2(a.mi) + '–' + bh + ':' + pad2(b.mi) + ' ' + (am ? 'AM' : 'PM');
    return ah + ':' + pad2(a.mi) + ' ' + (am ? 'AM' : 'PM') + '–' + bh + ':' + pad2(b.mi) + ' ' + (bm ? 'AM' : 'PM');
  }
  function fmtStatusTime(date) {
    var p = partsIn(date, tz);
    if (S.clock24) return pad2(p.h) + ':' + pad2(p.mi);
    return (p.h % 12 || 12) + ':' + pad2(p.mi) + (p.h < 12 ? 'am' : 'pm');
  }
  function fmtIn(ms) {
    var m = Math.ceil(ms / 60000);
    if (m < 60) return 'in ' + m + 'm';
    var h = Math.floor(m / 60), r = m % 60;
    return 'in ' + h + 'h' + (r ? ' ' + r + 'm' : '');
  }

  // ── calendars ──
  function calOf(id) {
    for (var i = 0; i < calendars.length; i++) if (calendars[i].id === id) return calendars[i];
    return null;
  }
  function calColor(id) { var c = calOf(id); return (c && c.color) || '#00d4ff'; }
  function shown(ev) { return S.hiddenCals.indexOf(ev.cal) < 0; }
  function rgba(hex, a) {
    var m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex || ''));
    if (!m) return 'rgba(0,212,255,' + a + ')';
    var h = m[1];
    if (h.length === 3) h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
    return 'rgba(' + parseInt(h.slice(0, 2), 16) + ',' + parseInt(h.slice(2, 4), 16) + ',' + parseInt(h.slice(4, 6), 16) + ',' + a + ')';
  }

  // ── data → days ──
  function prepData(d) {
    var evs = (d && d.events) || [];
    for (var i = 0; i < evs.length; i++) {
      var ev = evs[i];
      if (ev.allDay) continue;
      ev._s = partsIn(new Date(ev.start), tz);
      ev._e = partsIn(new Date(ev.end || ev.start), tz);
      ev._sk = keyOf(ev._s); ev._ek = keyOf(ev._e);
      ev._st = new Date(ev.start).getTime();
    }
  }
  function hasData() { return Object.keys(store).length > 0; }
  // The loaded range that answers for `key`: of the ranges covering it, the one the server generated last
  // (a range served from the server's 5-minute cache can arrive after a fresher one and must not win).
  function rangeFor(key) {
    var best = null, keys = Object.keys(store);
    for (var i = 0; i < keys.length; i++) {
      var r = store[keys[i]];
      if (r.from <= key && key < r.to && (!best || r.gen > best.gen)) best = r;
    }
    return best;
  }
  function known(key) { return !!rangeFor(key); }
  // Entries visible on `key`: {ev, allDay} or {ev, s, e} with s/e in wall-clock minutes of that day
  // (h*60+mi, so a DST day still lines up with its hour labels). A timed event that crosses midnight
  // appears on both days.
  function entriesOn(key) {
    if (byDay[key]) return byDay[key];
    var out = [];
    var range = rangeFor(key);
    var evs = (range && range.events) || [];
    for (var i = 0; i < evs.length; i++) {
      var ev = evs[i];
      if (!shown(ev)) continue;
      if (ev.allDay) {
        var end = ev.end > ev.start ? ev.end : addDays(ev.start, 1);   // Google's end date is exclusive
        if (ev.start <= key && key < end) out.push({ ev: ev, allDay: true });
        continue;
      }
      if (!ev._s || ev._sk > key || ev._ek < key) continue;
      var s = ev._sk < key ? 0 : ev._s.h * 60 + ev._s.mi;
      var e = ev._ek > key ? 1440 : ev._e.h * 60 + ev._e.mi;
      if (ev._sk < key && e === 0) continue;   // ended exactly at this midnight
      out.push({ ev: ev, s: s, e: Math.max(e, s) });
    }
    out.sort(function (a, b) {
      if (!!a.allDay !== !!b.allDay) return a.allDay ? -1 : 1;
      if (a.allDay) return a.ev.title < b.ev.title ? -1 : a.ev.title > b.ev.title ? 1 : 0;
      return a.s - b.s || b.e - a.e;
    });
    byDay[key] = out;
    return out;
  }

  // Lanes: events that overlap (transitively) form a cluster; each takes the first free lane and the
  // whole cluster splits the width evenly, so overlapping events sit side by side.
  function layoutLanes(items) {
    var cluster = null, clusterEnd = -1;
    var clusters = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (!cluster || it.vs >= clusterEnd) { cluster = { items: [], ends: [] }; clusters.push(cluster); clusterEnd = it.ve; }
      else if (it.ve > clusterEnd) clusterEnd = it.ve;
      var lane = -1;
      for (var j = 0; j < cluster.ends.length; j++) if (cluster.ends[j] <= it.vs) { lane = j; break; }
      if (lane < 0) { lane = cluster.ends.length; cluster.ends.push(it.ve); } else cluster.ends[lane] = it.ve;
      it.lane = lane;
      cluster.items.push(it);
    }
    for (var c = 0; c < clusters.length; c++) {
      for (var k = 0; k < clusters[c].items.length; k++) clusters[c].items[k].lanes = clusters[c].ends.length;
    }
  }

  // ── clock + NEXT UP ──
  function renderClock() {
    var now = new Date();
    var p = partsIn(now, tz);
    var c = $('clock');
    var main = S.clock24 ? pad2(p.h) + ':' + pad2(p.mi) : (p.h % 12 || 12) + ':' + pad2(p.mi);
    var sub = '';
    if (S.seconds) sub = ':' + pad2(p.s);
    if (!S.clock24) sub += (S.seconds ? ' ' : '') + (p.h < 12 ? 'AM' : 'PM');
    var want = main + '|' + sub;
    if (c.getAttribute('data-v') !== want) {
      c.setAttribute('data-v', want);
      c.textContent = main;
      if (sub) c.appendChild(el('span', 'sub', sub));
    }
    var key = keyOf(p);
    var wd = WD_LONG[weekdayOf(key)];
    if ($('weekday').textContent !== wd) $('weekday').textContent = wd;
    var ds = MONTHS[p.m - 1] + ' ' + p.d + ', ' + p.y;
    if ($('date').textContent !== ds) $('date').textContent = ds;
    if (key !== todayKey) {            // midnight: today moves, the view follows
      todayKey = key; selKey = key; monthCursor = null;
      renderAll();
      ensureRange();
      return;
    }
    var minute = key + ' ' + p.h + ':' + p.mi;
    if (minute !== lastMinute) {
      lastMinute = minute;
      placeNowLines(p);
      renderNext();
    }
    if (S.idleMin && Date.now() - lastTouch >= S.idleMin * 60000) goHome();
  }

  // ── idle return: nothing touched on the calendar or inside the chat drawer for S.idleMin minutes ->
  //    close the settings sheet, close the drawer (a conversation in progress keeps resetting the timer, so an
  //    open drawer here has had no input for that long) and show DAY on today. ──
  var lastTouch = Date.now();
  function markTouch() { lastTouch = Date.now(); }
  function goHome() {
    if ($('sheet').className.indexOf('open') >= 0) closeSheet();
    if ($('drawer').className.indexOf('open') >= 0) closeDrawer();
    if (view !== 'day' || selKey !== todayKey) { view = 'day'; selKey = todayKey; monthCursor = null; renderAll(); ensureRange(); }
  }
  // Input inside the drawer (same origin) counts as a touch; re-attached whenever the iframe loads a page.
  function hookDrawer() {
    try {
      var d = $('dexterFrame').contentDocument;
      if (!d || d.dexterIdleHooked) return;
      d.dexterIdleHooked = true;
      ['pointerdown', 'touchstart', 'mousedown', 'keydown', 'input'].forEach(function (t) { d.addEventListener(t, markTouch, { capture: true, passive: true }); });
    } catch (e) {}   // a cross-origin drawer cannot be watched: then only touches on the calendar count
  }

  function renderNext() {
    var box = $('next');
    clear(box);
    box.appendChild(el('div', 'next-label', 'NEXT UP'));
    if (!known(todayKey)) { box.appendChild(el('div', 'next-none', 'waiting for calendar')); return; }
    var now = Date.now();
    var best = null;
    var days = [todayKey, addDays(todayKey, 1)];
    for (var di = 0; di < days.length; di++) {
      var list = entriesOn(days[di]);   // visible calendars only
      for (var i = 0; i < list.length; i++) {
        var ev = list[i].ev;
        if (list[i].allDay || ev.declined || ev._st <= now || ev._sk !== days[di]) continue;
        if (!best || ev._st < best._st) best = ev;
      }
    }
    if (!best) { box.appendChild(el('div', 'next-none', 'Nothing else today')); return; }
    var isTomorrow = best._sk !== todayKey;
    if (isTomorrow) box.appendChild(el('div', 'next-none', 'Nothing else today'));
    box.appendChild(el('div', 'next-title', best.title));
    var t = el('div', 'next-time');
    if (isTomorrow) t.appendChild(el('span', 'tag', 'TOMORROW'));
    t.appendChild(document.createTextNode(fmtRange(best)));
    box.appendChild(t);
    box.appendChild(el('div', 'next-in', fmtIn(best._st - now)));
  }

  // ── bar + day buttons ──
  function renderBar() {
    var tabs = [['tabDay', 'day'], ['tabWeek', 'week'], ['tabMonth', 'month']];
    for (var i = 0; i < tabs.length; i++) $(tabs[i][0]).className = 'tab' + (view === tabs[i][1] ? ' on' : '');
    var isMonth = view === 'month';
    $('monthPrev').className = 'btn arrow' + (isMonth ? '' : ' hide');
    $('monthNext').className = 'btn arrow' + (isMonth ? '' : ' hide');
    $('days').className = 'days' + (isMonth ? ' hide' : '');
    var label = '', date = '', away = false;
    if (view === 'day') {
      away = selKey !== todayKey;
      label = !away ? 'TODAY' : selKey === addDays(todayKey, 1) ? 'TOMORROW' : selKey === addDays(todayKey, -1) ? 'YESTERDAY' : WD_LONG[weekdayOf(selKey)].toUpperCase();
      date = longDate(selKey);
    } else if (view === 'week') {
      var ws = weekStartOf(selKey), we = addDays(ws, 6);
      away = ws !== weekStartOf(todayKey);
      label = away ? 'WEEK' : 'THIS WEEK';
      date = shortDate(ws) + ' – ' + shortDate(we) + ', ' + parseKey(we).y;
    } else {
      var tp = parseKey(todayKey);
      away = monthCursor.y !== tp.y || monthCursor.m !== tp.m;
      label = MONTHS[monthCursor.m - 1].toUpperCase();
      date = String(monthCursor.y);
    }
    $('headLabel').textContent = label;
    $('headDate').textContent = date;
    $('todayBtn').className = 'btn gold' + (away ? '' : ' hide');
  }

  function renderDays() {
    var box = $('days');
    clear(box);
    var prev = el('div', 'dnav', '‹'); prev.id = 'weekPrev'; prev.setAttribute('aria-label', 'Previous week');
    prev.addEventListener('click', function () { stepWeek(-1); });
    box.appendChild(prev);
    var ws = weekStartOf(selKey);
    for (var i = 0; i < 7; i++) {
      var key = addDays(ws, i);
      var b = el('div', 'dbtn' + (S.workShade && isWork(key) ? ' work' : '') + (key === todayKey ? ' today' : '') + (view === 'day' && key === selKey ? ' sel' : ''));
      b.setAttribute('data-key', key);
      b.appendChild(el('span', 'wd', WD[weekdayOf(key)]));
      b.appendChild(el('span', 'dn', String(parseKey(key).d)));
      if (known(key) && entriesOn(key).length) b.appendChild(el('span', 'cnt'));
      b.addEventListener('click', onDayButton);
      box.appendChild(b);
    }
    var next = el('div', 'dnav', '›'); next.id = 'weekNext'; next.setAttribute('aria-label', 'Next week');
    next.addEventListener('click', function () { stepWeek(1); });
    box.appendChild(next);
  }
  function onDayButton(e) { showDay(e.currentTarget.getAttribute('data-key')); }
  function showDay(key) { selKey = key; view = 'day'; renderAll(); ensureRange(); }
  function stepWeek(n) { selKey = addDays(selKey, 7 * n); renderAll(); ensureRange(); }

  // ── time grid (DAY = one column, WEEK = seven) ──
  function pct(min) { return ((min - S.dayStart * 60) / ((S.dayEnd - S.dayStart) * 60) * 100) + '%'; }
  function chipFor(entry, withTime) {
    var ev = entry.ev;
    var c = el('div', 'chip' + (ev.declined ? ' declined' : ''));
    var color = calColor(ev.cal);
    c.style.borderLeftColor = color;
    c.style.backgroundColor = rgba(color, 0.18);
    if (withTime) c.appendChild(el('span', 'k', entry.allDay ? 'ALL DAY' : fmtRange(ev)));
    c.appendChild(document.createTextNode(ev.title));
    return c;
  }
  // Split a day's entries: chips (all-day, plus timed events wholly outside the visible hours) and blocks.
  function splitDay(key) {
    var lo = S.dayStart * 60, hi = S.dayEnd * 60;
    var chips = [], blocks = [];
    var list = entriesOn(key);
    for (var i = 0; i < list.length; i++) {
      var en = list[i];
      if (en.allDay) { chips.push(en); continue; }
      var outside = en.e === en.s ? (en.s < lo || en.s >= hi) : (en.e <= lo || en.s >= hi);
      if (outside) { chips.push(en); continue; }
      var vs = Math.max(en.s, lo);
      var ve = Math.min(Math.max(en.e, vs + MIN_BLOCK), hi);
      if (ve - vs < MIN_BLOCK) vs = Math.max(lo, ve - MIN_BLOCK);
      blocks.push({ en: en, vs: vs, ve: ve });
    }
    blocks.sort(function (a, b) { return a.vs - b.vs || b.ve - a.ve; });
    layoutLanes(blocks);
    return { chips: chips, blocks: blocks };
  }
  function buildTimeline(keys, week) {
    var tl = el('div', 'tl ' + (week ? 'week' : 'day'));
    tl.style.setProperty('--hours', String(S.dayEnd - S.dayStart));
    var hours = el('div', 'tl-hours');
    var body = el('div', 'tl-body');
    for (var h = S.dayStart; h <= S.dayEnd; h++) {
      var lab = el('div', 'tl-hl', fmtHour(h));
      lab.style.top = pct(h * 60);
      hours.appendChild(lab);
      var line = el('div', 'tl-line'); line.style.top = pct(h * 60); body.appendChild(line);
      if (!week && h < S.dayEnd) { var half = el('div', 'tl-line half'); half.style.top = pct(h * 60 + 30); body.appendChild(half); }
    }
    for (var i = 0; i < keys.length; i++) {
      var key = keys[i];
      var kn = known(key);
      var col = el('div', 'tl-col' + (S.workShade && isWork(key) ? ' work' : '') + (key === todayKey ? ' today' : '') + (hasData() && !kn ? ' out' : ''));
      col.setAttribute('data-key', key);
      if (week) col.addEventListener('click', onDayButton);
      if (kn) {
        var blocks = splitDay(key).blocks;
        for (var j = 0; j < blocks.length; j++) col.appendChild(blockFor(blocks[j], week));
      }
      if (key === todayKey) { var nl = el('div', 'now-line'); col.appendChild(nl); }
      body.appendChild(col);
    }
    tl.appendChild(hours);
    tl.appendChild(body);
    if (week) tl.appendChild(el('div', 'tl-spacer'));
    return tl;
  }
  function blockFor(b, week) {
    var ev = b.en.ev;
    var dur = b.ve - b.vs;
    var blk = el('div', 'ev' + (dur < 50 ? ' short' : '') + (ev.declined ? ' declined' : '') + (ev.status === 'tentative' ? ' tentative' : ''));
    blk.style.top = pct(b.vs);
    blk.style.height = 'calc(' + pct(b.ve) + ' - ' + pct(b.vs) + ' - 2px)';
    var w = 100 / b.lanes;
    blk.style.left = 'calc(' + (b.lane * w) + '% + 2px)';
    blk.style.width = 'calc(' + w + '% - 4px)';
    var color = calColor(ev.cal);
    blk.style.borderLeftColor = color;
    blk.style.backgroundColor = rgba(color, ev.declined ? 0.10 : 0.22);
    blk.setAttribute('data-id', ev.id);
    blk.appendChild(el('div', 'ev-t', fmtRange(ev)));
    blk.appendChild(el('div', 'ev-n', ev.title));
    if (!week && ev.location && dur >= 75) blk.appendChild(el('div', 'ev-l', ev.location));
    return blk;
  }
  function placeNowLines(p) {
    var lines = document.querySelectorAll('.now-line');
    if (!lines.length) return;
    var min = p.h * 60 + p.mi;
    var on = min >= S.dayStart * 60 && min <= S.dayEnd * 60;
    for (var i = 0; i < lines.length; i++) {
      lines[i].style.display = on ? 'block' : 'none';
      lines[i].style.top = pct(min);
    }
  }
  function message(text, wide, unk) { var m = el('div', 'msg' + (wide ? ' wide' : '') + (unk ? ' unk' : '')); m.appendChild(el('span', '', text)); return m; }
  function unknownText() { return viewLoading() ? 'loading…' : 'not loaded'; }

  function renderDayView(v) {
    var key = selKey;
    var kn = known(key);
    var split = kn ? splitDay(key) : { chips: [], blocks: [] };
    if (split.chips.length) {
      var chips = el('div', 'chips');
      for (var i = 0; i < split.chips.length; i++) chips.appendChild(chipFor(split.chips[i], true));
      v.appendChild(chips);
    }
    var tl = buildTimeline([key], false);
    v.appendChild(tl);
    if (!hasData()) tl.appendChild(message('waiting for calendar'));
    else if (!kn) tl.appendChild(message(unknownText(), false, true));
    else if (!split.chips.length && !split.blocks.length) tl.appendChild(message('Nothing scheduled'));
  }

  function renderWeekView(v) {
    var ws = weekStartOf(selKey);
    var keys = [];
    for (var i = 0; i < 7; i++) keys.push(addDays(ws, i));
    var any = false;
    var row = el('div', 'wk-allday');
    row.appendChild(el('div', 'lbl', 'ALL DAY'));
    var cells = el('div', 'cells');
    for (var k = 0; k < 7; k++) {
      var cell = el('div', 'cell');
      if (known(keys[k])) {
        var chips = splitDay(keys[k]).chips;
        for (var c = 0; c < chips.length && c < 2; c++) { cell.appendChild(chipFor(chips[c], !chips[c].allDay)); any = true; }
        if (chips.length > 2) cell.appendChild(el('div', 'more', '+' + (chips.length - 2)));
      }
      cells.appendChild(cell);
    }
    row.appendChild(cells);
    row.appendChild(el('div', 'sp'));
    if (any) v.appendChild(row);
    var tl = buildTimeline(keys, true);
    v.appendChild(tl);
    if (!hasData()) tl.appendChild(message('waiting for calendar'));
    else {
      var n = 0;
      for (var j = 0; j < 7; j++) if (known(keys[j])) n++;
      if (!n) tl.appendChild(message(unknownText(), false, true));
    }
  }

  function renderMonthView(v) {
    var y = monthCursor.y, m = monthCursor.m;
    var head = el('div', 'mwd');
    for (var w = 0; w < 7; w++) {
      var wd = (S.weekStart + w) % 7;
      head.appendChild(el('div', S.workShade && wd >= 1 && wd <= 5 ? 'work' : '', WD[wd]));
    }
    v.appendChild(head);
    var grid = el('div', 'mgrid');
    var first = y + '-' + pad2(m) + '-01';
    var start = weekStartOf(first);
    var days = new Date(Date.UTC(y, m, 0)).getUTCDate();
    var last = y + '-' + pad2(m) + '-' + pad2(days);
    var end = addDays(weekStartOf(last), 6);
    var anyKnown = false;
    for (var key = start; key <= end; key = addDays(key, 1)) {
      var p = parseKey(key);
      var kn = known(key);
      if (kn) anyKnown = true;
      var cell = el('div', 'mday' + (p.m !== m ? ' other' : '') + (S.workShade && isWork(key) ? ' work' : '') +
        (key === todayKey ? ' today' : '') + (key === selKey ? ' sel' : '') + (hasData() && !kn ? ' out' : ''));
      cell.setAttribute('data-key', key);
      cell.appendChild(el('div', 'n', String(p.d)));
      if (kn) {
        var list = entriesOn(key);
        if (list.length) {
          var dots = el('div', 'dots');
          for (var k = 0; k < list.length && k < 5; k++) {
            var dot = el('span', 'dot');
            dot.style.background = calColor(list[k].ev.cal);
            dots.appendChild(dot);
          }
          dots.appendChild(el('span', 'count', String(list.length)));
          cell.appendChild(dots);
        }
      }
      cell.addEventListener('click', onDayButton);
      grid.appendChild(cell);
    }
    v.appendChild(grid);
    if (!hasData()) v.appendChild(message('waiting for calendar', true));
    else if (!anyKnown) v.appendChild(message(unknownText(), true, true));
  }

  var lastViewSig = '';
  function renderView() {
    var v = $('view');
    var sig = view + '|' + (view === 'month' ? monthCursor.y + '-' + monthCursor.m : selKey);
    var keep = sig === lastViewSig ? v.scrollTop : -1;   // same view re-rendered (a refresh): stay where the reader is
    lastViewSig = sig;
    clear(v);
    if (view === 'day') renderDayView(v);
    else if (view === 'week') renderWeekView(v);
    else renderMonthView(v);
    placeNowLines(partsIn(new Date(), tz));
    if (keep >= 0) v.scrollTop = keep; else scrollToWork(v);
  }
  // Phone only (the wall fits the whole range): bring the useful hours into view.
  function scrollToWork(v) {
    if (view === 'month' || v.scrollHeight <= v.clientHeight + 4) return;
    var target = -1;
    if (selKey === todayKey) { var p = partsIn(new Date(), tz); target = p.h * 60 + p.mi - 60; }
    else if (view === 'day') {
      var b = known(selKey) ? splitDay(selKey).blocks : [];
      if (b.length) target = b[0].vs - 30;
    }
    if (target < 0) { v.scrollTop = 0; return; }
    var tl = v.querySelector('.tl');
    if (!tl) return;
    var frac = (target - S.dayStart * 60) / ((S.dayEnd - S.dayStart) * 60);
    v.scrollTop = Math.max(0, tl.offsetTop + frac * tl.offsetHeight - 8);
  }

  function renderAll() {
    byDay = {};
    if (!selKey) selKey = todayKey;
    if (!monthCursor) { var p = parseKey(selKey); monthCursor = { y: p.y, m: p.m }; }
    renderBar();
    if (view !== 'month') renderDays();
    renderView();
    renderNext();
    renderLoading();
  }

  // ── navigation ──
  function setView(v) {
    view = v;
    if (v === 'month') { var p = parseKey(selKey); monthCursor = { y: p.y, m: p.m }; }
    renderAll();
    ensureRange();
  }
  function stepMonth(n) {
    var m = monthCursor.m + n, y = monthCursor.y;
    if (m < 1) { m = 12; y--; } else if (m > 12) { m = 1; y++; }
    monthCursor = { y: y, m: m };
    renderAll();
    ensureRange();
  }
  function goToday() {
    selKey = todayKey;
    var p = parseKey(todayKey);
    monthCursor = { y: p.y, m: p.m };
    renderAll();
    ensureRange();
  }

  // ── settings sheet ──
  function seg(label, options, current, onPick, hint) {
    var row = el('div', 'row');
    var l = el('div', 'row-l');
    var t = el('div', '', label);
    if (hint) t.appendChild(el('small', '', hint));
    l.appendChild(t);
    row.appendChild(l);
    var box = el('div', 'seg');
    options.forEach(function (o) {
      var b = el('div', o[1] === current ? 'on' : '', o[0]);
      b.setAttribute('data-v', String(o[1]));
      b.addEventListener('click', function () { onPick(o[1]); });
      box.appendChild(b);
    });
    row.appendChild(box);
    return row;
  }
  function stepper(label, id, value, onStep) {
    var row = el('div', 'row');

    var st = el('div', 'step');
    var minus = el('div', 'btn', '−'); minus.id = id + 'Minus';
    var v = el('div', 'v', value); v.id = id + 'Val';
    var plus = el('div', 'btn', '+'); plus.id = id + 'Plus';
    minus.addEventListener('click', function () { onStep(-1); });
    plus.addEventListener('click', function () { onStep(1); });
    st.appendChild(minus); st.appendChild(v); st.appendChild(plus);
    row.appendChild(st);
    return row;
  }
  function changed() { saveSettings(); lastMinute = ''; renderClock(); renderAll(); renderStatus(); renderSheet(); ensureRange(); }
  function renderSheet() {
    var body = $('sheetBody');

    body.appendChild(el('div', 'sec-label', 'CLOCK'));

    r1.id = 'setClock'; body.appendChild(r1);
    var r2 = seg('Seconds', [['OFF', false], ['ON', true]], S.seconds, function (v) { S.seconds = v; changed(); });
    r2.id = 'setSeconds'; body.appendChild(r2);
    body.appendChild(el('div', 'sec-label', 'WEEK'));
    var r3 = seg('Week starts', [['SUNDAY', 0], ['MONDAY', 1]], S.weekStart, function (v) { S.weekStart = v; changed(); });
    r3.id = 'setWeekStart'; body.appendChild(r3);
    var r4 = seg('Work week shading', [['ON', true], ['OFF', false]], S.workShade, function (v) { S.workShade = v; changed(); }, 'Monday to Friday');
    r4.id = 'setWorkShade'; body.appendChild(r4);
    body.appendChild(el('div', 'sec-label', 'DAY VIEW HOURS'));
    body.appendChild(stepper('Starts at', 'setStart', fmtHour(S.dayStart), function (n) {

    }));
    body.appendChild(stepper('Ends at', 'setEnd', fmtHour(S.dayEnd), function (n) {

    }));

    var r5 = seg('Return to today after', [['5 MIN', 5], ['15 MIN', 15], ['NEVER', 0]], S.idleMin, function (v) { S.idleMin = v; changed(); });
    r5.id = 'setIdle'; body.appendChild(r5);
    body.appendChild(el('div', 'sec-label', 'CALENDARS SHOWN'));

    cals.forEach(function (c) {
      var on = S.hiddenCals.indexOf(c.id) < 0;
      var row = seg(c.name || c.id, [['ON', true], ['OFF', false]], on, function (v) {
        var i = S.hiddenCals.indexOf(c.id);

      });
      row.className = 'row cal-row';

  }
  function openSheet() { renderSheet(); $('sheet').className = 'sheet open'; $('sheetScrim').className = 'sheet-scrim open'; }
  function closeSheet() { $('sheet').className = 'sheet'; $('sheetScrim').className = 'sheet-scrim'; }

  // ── status: kept as a kind + message so a 12/24h change re-formats the time in it ──
  var status = { kind: 'loading', msg: '', level: '' };
  function setStatus(kind, msg, level) { status = { kind: kind, msg: msg || '', level: level || '' }; renderStatus(); }
  function renderStatus() {
    var showing = lastGood ? ' · showing ' + fmtStatusTime(lastGood) : '';
    var text = status.kind === 'ok' ? 'updated ' + fmtStatusTime(lastGood)
      : status.kind === 'offline' ? (lastGood ? 'offline' + showing : 'offline')
      : status.kind === 'err' ? status.msg + showing
      : status.kind === 'pass' ? 'passphrase needed · tap here'
      : 'loading…';
    var s = $('status');
    s.textContent = text;
    s.className = 'status' + (status.level ? ' ' + status.level : '');
  }

  // ── passphrase: same key and prompt as index.html ──
  function storedPass() {
    try { return localStorage.getItem('dexterPass') || ''; } catch (e) { return ''; }
  }
  function askPass() {
    var entered = window.prompt('DEXTER passphrase');
    if (entered) { try { localStorage.setItem('dexterPass', entered); } catch (e) {} }
    return !!entered;
  }

  // ── fetch: DAY/WEEK need the shown week ±7 days, MONTH its whole grid; every range loaded is kept ──
  function rangeKey(r) { return r.from + '|' + r.to; }
  function weekRange(key) { var ws = weekStartOf(key); return { from: addDays(ws, -7), to: addDays(ws, 14) }; }   // to is exclusive
  function viewRange() {
    if (view === 'month') { var s = weekStartOf(monthCursor.y + '-' + pad2(monthCursor.m) + '-01'); return { from: s, to: addDays(s, 42) }; }
    return weekRange(selKey);
  }
  function viewLoading() { return !!inflight[rangeKey(viewRange())]; }
  function renderLoading() {
    var on = viewLoading();
    $('loadbar').className = 'loadbar' + (on ? ' on' : '');
    var msgs = document.querySelectorAll('.msg.unk span');   // a range starting or finishing updates its message in place
    for (var i = 0; i < msgs.length; i++) msgs[i].textContent = on ? 'loading…' : 'not loaded';
  }
  function fresh(r) { var e = store[rangeKey(r)]; return !!e && Date.now() - e.at < REFRESH_MS; }
  // After navigation: fetch what the view needs unless it is fresh or already on its way.
  function ensureRange() { var r = viewRange(); if (!fresh(r)) load(r); else renderLoading(); }
  // The 5-minute refresh: the view's range, plus this week's (quietly) when the view is elsewhere, so NEXT UP
  // and today stay current while the wall shows another month.
  function refresh() {
    var r = viewRange();
    load(r);
    if (!(r.from <= todayKey && addDays(todayKey, 1) < r.to)) load(weekRange(todayKey), false, true);
  }
  function pruneStore() {
    var keys = Object.keys(store);
    while (keys.length > 12) {
      var oldest = keys[0];
      for (var i = 1; i < keys.length; i++) if (store[keys[i]].at < store[oldest].at) oldest = keys[i];
      delete store[oldest];
      keys = Object.keys(store);
    }
  }
  function load(range, retried, quiet) {
    var k = rangeKey(range);
    if (inflight[k] && !retried) return;
    inflight[k] = true;
    renderLoading();
    var sent = storedPass();
    var done = function () { inflight[k] = false; renderLoading(); };
    return fetch(CAL_ENDPOINT + '?from=' + range.from + '&to=' + range.to, { headers: { 'X-Dexter-Passphrase': encodeURIComponent(sent) }, cache: 'no-store' })
      .then(function (r) {
        if (r.status === 401) {
          if (!retried && storedPass() !== sent) return load(range, true, quiet);   // a newer passphrase was typed meanwhile
          if (quiet) { done(); return; }
          try { localStorage.removeItem('dexterPass'); } catch (e) {}
          if (!retried && askPass()) return load(range, true, quiet);
          done();
          setStatus('pass', '', 'warn');
          return;
        }
        return r.json().then(function (d) {
          done();
          if (!r.ok) {
            if (!quiet) setStatus('err', d && d.error ? d.error : 'calendar unavailable', r.status === 503 ? 'warn' : 'bad');
            renderAll();   // 'loading…' becomes 'not loaded'
            return;
          }
          tz = d.tz || DEFAULT_TZ;
          partFmt = {};
          prepData(d);
          store[k] = { from: d.from || range.from, to: d.to || range.to, events: d.events || [], gen: Date.parse(d.generatedAt) || Date.now(), at: Date.now() };
          pruneStore();
          calendars = d.calendars || [];
          lastGood = new Date();
          var key = dayKey(lastGood);
          var moved = key !== todayKey;
          if (moved) { todayKey = key; selKey = key; monthCursor = null; }
          renderAll();
          if ($('sheet').className.indexOf('open') >= 0) renderSheet();
          if (!quiet) setStatus('ok');
          if (moved) ensureRange();
        });
      })
      .catch(function () {
        done();
        if (!quiet) setStatus('offline', '', 'warn');
        renderAll();
      });
  }

  // ── drawer ──
  function openDrawer() {
    var f = $('dexterFrame');
    if (!f.getAttribute('src')) f.setAttribute('src', CHAT_SRC);
    $('drawer').className = 'drawer open';
    $('scrim').className = 'scrim open';
  }
  function closeDrawer() {
    $('drawer').className = 'drawer';
    $('scrim').className = 'scrim';
  }

  // ── face: the idle loop from index.html, same fallback chain ──
  //   video  : <video> playing avatar-idle.webm (muted, looping, inline)
  //   webp   : <img> showing avatar-idle.webp when the WebView refuses muted autoplay, cannot decode VP9, or errors
  //   static : <img> showing avatar.png for prefers-reduced-motion or if the .webp fails to load
  var FACE = { mode: 'static', state: 'idle', ready: false, retryArmed: false, retried: false };
  function faceReduced() {
    try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { return false; }
  }
  function setFaceMode(mode) {
    FACE.mode = mode;
    var cl = document.body.classList;
    cl.remove('face-mode-video'); cl.remove('face-mode-webp'); cl.remove('face-mode-static');
    cl.add('face-mode-' + mode);
    if (mode !== 'video') {
      var v = $('faceVideo');
      try { v.pause(); } catch (e) {}
      v.removeAttribute('src');
      try { v.load(); } catch (e) {}
    }
    faceApply();
  }
  function faceApply() {
    if (!FACE.ready) return;
    var name = FACE.state;
    if (FACE.mode === 'video') {
      var v = $('faceVideo');
      var src = 'avatar-' + name + '.webm';
      if (v.getAttribute('src') !== src) v.setAttribute('src', src);
      var p;
      try { p = v.play(); } catch (e) { p = Promise.reject(e); }
      if (p && p.catch) p.catch(function (err) {
        if (err && err.name === 'AbortError') return;          // src swapped mid-play: not a policy refusal
        if (FACE.mode !== 'video') return;
        setFaceMode('webp');                                   // autoplay refused / not supported: animated WebP
        if (err && err.name === 'NotAllowedError' && !FACE.retryArmed) {
          FACE.retryArmed = true;                              // refused before any touch: retry once after the first gesture
          document.addEventListener('click', faceRetryVideo, { capture: true, once: true });
          document.addEventListener('keydown', faceRetryVideo, { capture: true, once: true });
        }
      });
    } else {
      var isrc = FACE.mode === 'webp' ? 'avatar-' + name + '.webp' : 'avatar.png';
      var img = $('faceImg');
      if (img.getAttribute('src') !== isrc) img.setAttribute('src', isrc);
    }
  }
  function faceRetryVideo() {
    if (FACE.retried || FACE.mode !== 'webp') return;
    FACE.retried = true;
    var v = $('faceVideo');
    v.setAttribute('src', 'avatar-' + FACE.state + '.webm');
    var p;
    try { p = v.play(); } catch (e) { return; }
    if (p && p.then) p.then(function () { if (FACE.mode === 'webp') setFaceMode('video'); },
                            function () { try { v.removeAttribute('src'); v.load(); } catch (e) {} });   // still refused: stay on WebP
  }
  function faceImgError() {
    var img = $('faceImg');
    if ((img.getAttribute('src') || '') === 'avatar.png') { img.style.visibility = 'hidden'; return; }
    if (FACE.mode !== 'static') setFaceMode('static');
  }
  function faceInit() {
    FACE.ready = true;
    $('faceImg').addEventListener('error', faceImgError);
    if (faceReduced()) { setFaceMode('static'); return; }
    var probe = document.createElement('video');
    var vp9 = probe.canPlayType && probe.canPlayType('video/webm; codecs="vp9"');
    if (!vp9) { setFaceMode('webp'); return; }
    $('faceVideo').addEventListener('error', function () { if (FACE.mode === 'video') setFaceMode('webp'); });
    setFaceMode('video');
    try {
      var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
      var onChange = function () { setFaceMode(mq.matches ? 'static' : 'video'); };
      if (mq.addEventListener) mq.addEventListener('change', onChange); else if (mq.addListener) mq.addListener(onChange);
    } catch (e) {}
  }

  // ── wire up ──
  ['pointerdown', 'touchstart', 'mousedown', 'keydown', 'wheel'].forEach(function (t) { document.addEventListener(t, markTouch, { capture: true, passive: true }); });
  $('dexterFrame').addEventListener('load', hookDrawer);
  $('face').addEventListener('click', openDrawer);
  $('drawerClose').addEventListener('click', closeDrawer);
  $('scrim').addEventListener('click', closeDrawer);
  $('gearBtn').addEventListener('click', openSheet);
  $('sheetDone').addEventListener('click', closeSheet);
  $('sheetScrim').addEventListener('click', closeSheet);
  $('tabDay').addEventListener('click', function () { setView('day'); });
  $('tabWeek').addEventListener('click', function () { setView('week'); });
  $('tabMonth').addEventListener('click', function () { setView('month'); });
  $('monthPrev').addEventListener('click', function () { stepMonth(-1); });
  $('monthNext').addEventListener('click', function () { stepMonth(1); });
  $('todayBtn').addEventListener('click', goToday);
  $('status').addEventListener('click', function () { if (!storedPass() && askPass()) load(viewRange()); });

  faceInit();
  todayKey = dayKey(new Date());
  selKey = todayKey;
  renderClock();
  renderAll();
  if (!storedPass()) askPass();
  load(viewRange());
  setInterval(renderClock, 1000);
  setInterval(refresh, REFRESH_MS);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && lastGood && Date.now() - lastGood.getTime() > REFRESH_MS) refresh();
  });
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
</body>
</html>
